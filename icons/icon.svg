<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sunday School Bingo">
  <!-- Flat, like the card: paper, hairline rules, one seasonal accent. The icon
       is fixed at Ordinary Time green, which is most of the year. -->
  <rect width="512" height="512" fill="#e7e1d5" />
  <rect x="48" y="48" width="416" height="416" fill="#cdc5b4" />

  <g fill="#f7f4ec">
    <rect x="50" y="50" width="81.6" height="81.6" />
    <rect x="133.6" y="50" width="81.6" height="81.6" />
    <rect x="217.2" y="50" width="81.6" height="81.6" />
    <rect x="300.8" y="50" width="81.6" height="81.6" />
    <rect x="384.4" y="50" width="77.6" height="81.6" />

    <rect x="50" y="133.6" width="81.6" height="81.6" />
    <rect x="133.6" y="133.6" width="81.6" height="81.6" />
    <rect x="217.2" y="133.6" width="81.6" height="81.6" />
    <rect x="300.8" y="133.6" width="81.6" height="81.6" />
    <rect x="384.4" y="133.6" width="77.6" height="81.6" />

    <rect x="50" y="217.2" width="81.6" height="81.6" />
    <rect x="133.6" y="217.2" width="81.6" height="81.6" />
    <rect x="217.2" y="217.2" width="81.6" height="81.6" />
    <rect x="300.8" y="217.2" width="81.6" height="81.6" />
    <rect x="384.4" y="217.2" width="77.6" height="81.6" />

    <rect x="50" y="300.8" width="81.6" height="81.6" />
    <rect x="133.6" y="300.8" width="81.6" height="81.6" />
    <rect x="217.2" y="300.8" width="81.6" height="81.6" />
    <rect x="300.8" y="300.8" width="81.6" height="81.6" />
    <rect x="384.4" y="300.8" width="77.6" height="81.6" />

    <rect x="50" y="384.4" width="81.6" height="77.6" />
    <rect x="133.6" y="384.4" width="81.6" height="77.6" />
    <rect x="217.2" y="384.4" width="81.6" height="77.6" />
    <rect x="300.8" y="384.4" width="81.6" height="77.6" />
    <rect x="384.4" y="384.4" width="77.6" height="77.6" />
  </g>

  <!-- A winning diagonal, solid; a couple of ordinary marks, washed. -->
  <g fill="#3f6b4a">
    <rect x="50" y="50" width="81.6" height="81.6" />
    <rect x="133.6" y="133.6" width="81.6" height="81.6" />
    <rect x="217.2" y="217.2" width="81.6" height="81.6" />
    <rect x="300.8" y="300.8" width="81.6" height="81.6" />
    <rect x="384.4" y="384.4" width="77.6" height="77.6" />
  </g>

  <g fill="#dde4dc">
    <rect x="300.8" y="133.6" width="81.6" height="81.6" />
    <rect x="50" y="300.8" width="81.6" height="81.6" />
    <rect x="217.2" y="384.4" width="81.6" height="77.6" />
  </g>
</svg>
